name: Harness fixture tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: macos-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-harness.txt
      - run: python scripts/validate_harness.py --report harness-results/unittest.txt
      - run: python scripts/evaluate_product.py --report harness-results/fixture-matrix.json
        if: always()
      - run: python scripts/evaluate_rc3.py --mode all --report harness-results/rc3-eval.json
        if: always()
      - run: python scripts/privacy_scan.py
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harness-fixture-${{ matrix.os }}-${{ matrix.python }}
          path: harness-results/
          if-no-files-found: error
          retention-days: 14
